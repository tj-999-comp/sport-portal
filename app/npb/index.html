<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="2026年プロ野球の試合予定・結果と順位情報を確認するページ">
  <title>スポーツポータル | 2026 NPB</title>
  <link rel="stylesheet" href="/styles.css?v=1.0.2-league-tabs-1">
  <link rel="stylesheet" href="/npb.css?v=npb-phase-4">
</head>
<body class="npb-theme">
  <main class="npb-shell">
    <header class="npb-header">
      <div class="npb-site-header">
        <h1><a href="/" class="npb-brand">スポーツポータル</a></h1>
        <span class="npb-season">2026 NPB</span>
      </div>

      <section class="npb-date-section" aria-labelledby="npb-selected-date">
        <div class="npb-status" aria-live="polite">
          <span class="npb-status-dot" id="npb-status-dot"></span>
          <strong id="npb-status-label">読み込み中</strong>
          <span id="npb-status-detail">NPB公式データを確認しています</span>
          <time id="npb-updated-at"></time>
        </div>
        <h2 id="npb-selected-date" class="npb-selected-date">2026年</h2>
        <nav id="npb-date-nav" class="npb-date-nav" aria-label="試合日"></nav>
        <nav class="npb-league-tabs" role="tablist" aria-label="リーグ">
          <button type="button" role="tab" aria-selected="true" data-npb-league="central">セ・リーグ</button>
          <button type="button" role="tab" aria-selected="false" data-npb-league="pacific">パ・リーグ</button>
        </nav>
      </section>
    </header>

    <section class="npb-main" role="tabpanel" tabindex="-1" aria-label="NPBの日程・結果">
      <div id="npb-days" class="npb-days" aria-label="日付ごとの試合一覧"></div>
      <p id="npb-empty" class="npb-empty" hidden>データを取得できていません</p>
    </section>

    <nav class="npb-bottom-nav" aria-label="操作">
      <button type="button" id="npb-refresh"><span aria-hidden="true">↻</span><small>手動更新</small></button>
      <button type="button" id="npb-standings-open" aria-label="各種順位を開く" aria-controls="npb-standings-modal" aria-expanded="false"><span aria-hidden="true">▦</span><small>各種順位</small></button>
    </nav>
  </main>

  <section class="npb-modal" id="npb-standings-modal" role="dialog" aria-modal="true" aria-label="各種順位" aria-hidden="true" hidden>
    <button type="button" class="npb-modal-backdrop" id="npb-modal-backdrop" aria-label="閉じる"></button>
    <div class="npb-modal-panel" tabindex="-1">
      <nav class="npb-modal-tabs" role="tablist" aria-label="NPB情報">
        <button type="button" role="tab" aria-selected="true" data-npb-modal-tab="standings">順位表</button>
        <button type="button" role="tab" aria-selected="false" data-npb-modal-tab="interleague">交流戦順位</button>
        <button type="button" role="tab" aria-selected="false" data-npb-modal-tab="cs">クライマックスシリーズ</button>
        <button type="button" role="tab" aria-selected="false" data-npb-modal-tab="japanSeries">日本シリーズ</button>
      </nav>
      <div id="npb-modal-content" class="npb-modal-content"></div>
    </div>
  </section>
  <script type="module" src="/npb.js?v=npb-phase-4"></script>
</body>
</html>
