name: Update NBA data

on:
  # UTC schedule for 08:00, 10:00, 12:00, 14:00, and 16:00 JST.
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 1 * * *'
    - cron: '0 3 * * *'
    - cron: '0 5 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to update
        required: true
        default: stg
        type: choice
        options: [stg]

permissions:
  contents: read

concurrency:
  group: sport-portal-nba-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update STG NBA data
        env:
          STG_API_URL: ${{ vars.SPORTAL_STG_API_URL || secrets.SPORTAL_STG_API_URL }}
          API_USER: ${{ secrets.SPORTAL_API_USER }}
          API_PASSWORD: ${{ secrets.SPORTAL_API_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STG_API_URL"
          test -n "$API_USER"
          test -n "$API_PASSWORD"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl \
            --silent \
            --show-error \
            --location \
            --user "$API_USER:$API_PASSWORD" \
            --request POST \
            --header 'Accept: application/json' \
            --connect-timeout 15 \
            --max-time 300 \
            --retry 2 \
            --retry-delay 5 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "${STG_API_URL%/}/api/nba/update")"

          if [[ "$http_code" != 2* ]]; then
            error_message="$(jq -r '.error // "HTTP request failed"' "$response_file" 2>/dev/null || true)"
            echo "stg/nba update failed (HTTP ${http_code}): ${error_message}" >&2
            exit 1
          fi

          jq -e '.data.sport == "nba" and .data.season == "2026-27" and .data.update.status == "success"' "$response_file" >/dev/null
          echo "stg/nba update completed successfully"
