name: Notify Slack

on:
  push:
    branches: [main]
    paths:
      - work-records/md/**
      - work-records/metadata/**
  workflow_dispatch:
    inputs:
      target_basename:
        description: Numbered basename, for example work_record_010
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fixed source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source
        run: python3 scripts/dev/validate_work_records.py

      - name: Resolve target basenames
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BASENAME: ${{ inputs.target_basename }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            targets="$TARGET_BASENAME"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            changed_paths="$(git diff-tree --no-commit-id --name-only -r "$PUSH_SHA")"
            targets="$(printf '%s\n' "$changed_paths" | sed -nE 's#^work-records/(md|metadata)/(work_record_[0-9]{3})\.(md|yml)$#\2#p' | sort -u | paste -sd, -)"
          else
            changed_paths="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA")"
            targets="$(printf '%s\n' "$changed_paths" | sed -nE 's#^work-records/(md|metadata)/(work_record_[0-9]{3})\.(md|yml)$#\2#p' | sort -u | paste -sd, -)"
          fi

          if [[ -z "$targets" ]]; then
            echo "No work records changed; nothing to notify."
            echo "targets=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=',' read -r -a target_array <<< "$targets"
          for target in "${target_array[@]}"; do
            [[ "$target" =~ ^work_record_[0-9]{3}$ ]]
            test -f "work-records/md/$target.md"
            test -f "work-records/metadata/$target.yml"
          done
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Require Slack webhook secret
        if: steps.targets.outputs.targets != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WORK_RECORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::error::SLACK_WORK_RECORD_WEBHOOK_URL is not configured. Add the Slack Incoming Webhook URL as a repository secret."
            exit 1
          fi

      - name: Notify each work record
        if: steps.targets.outputs.targets != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WORK_RECORD_WEBHOOK_URL }}
          TARGET_BASENAMES: ${{ steps.targets.outputs.targets }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a target_array <<< "$TARGET_BASENAMES"
          for target in "${target_array[@]}"; do
            title="$(sed -n '1s/^# 作業記録 [0-9][0-9][0-9]: //p' "work-records/md/$target.md")"
            test -n "$title"
            record_url="$SERVER_URL/$REPOSITORY/blob/$COMMIT_SHA/work-records/md/$target.md"
            message=$(printf '作業記録を追加しました\n*%s*\n<%s|GitHubで確認>' "$title" "$record_url")
            payload="$(jq -n --arg text "$message" '{text: $text}')"
            response="$(curl --fail-with-body --silent --show-error --request POST --header 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL")"
            test "$response" = "ok"
          done
