<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="J1リーグの試合予定・結果・順位表を確認するスポーツポータル">
  <title>スポーツポータル | 2026 J1</title>
  <link rel="stylesheet" href="/styles.css?v=1.0.1-flat-match-days-fix">
</head>
<body>
  <main class="page-shell">
    <header class="app-header">
      <div class="site-header">
        <div class="brand-lockup"><h1><a class="brand-link" href="/">スポーツポータル</a></h1></div>
        <div class="header-meta"><a class="header-link" href="/design-review.html">レビュー</a><span class="version-badge">v1.0.0 STG</span></div>
      </div>

      <section class="date-section" aria-labelledby="selected-date">
        <section class="status-strip" aria-live="polite">
          <span class="status-indicator" id="status-indicator"></span>
          <span class="status-label" id="status-label">読み込み中</span>
          <span class="status-detail" id="status-detail"></span>
          <time class="updated-at" id="updated-at"></time>
        </section>
        <h2 class="selected-date" id="selected-date">2026年9月6日</h2>
        <nav class="date-nav" id="date-nav" aria-label="日付"></nav>
      </section>
    </header>

    <section class="matches-section" aria-label="試合日程・結果">
      <div class="match-days" id="match-days" tabindex="0" aria-label="試合日ごとの一覧"></div>
      <p class="empty-state" id="empty-state" hidden>データを取得できていません</p>
    </section>

    <nav class="bottom-nav" aria-label="操作">
      <button id="refresh-button" type="button"><span aria-hidden="true">↻</span><small>更新</small></button>
      <button id="standings-button" type="button" aria-label="順位表を開く" aria-controls="standings-sheet" aria-expanded="false"><span id="standings-icon" aria-hidden="true">▦</span><small id="standings-label">順位</small></button>
    </nav>
  </main>

  <section class="standings-sheet" id="standings-sheet" role="dialog" aria-modal="true" aria-label="順位表" aria-hidden="true" hidden>
    <button class="sheet-backdrop" id="standings-backdrop" type="button" aria-label="順位表を閉じる"></button>
    <div class="standings-sheet-panel" id="standings-panel" tabindex="-1">
      <div class="modal-grabber" aria-hidden="true"></div>
      <div class="table-wrap" tabindex="0" aria-label="順位表をスクロール">
        <table>
          <thead>
            <tr><th>順位</th><th class="team-column">チーム</th><th>試合</th><th>勝</th><th>分</th><th>負</th><th>得点</th><th>失点</th><th>得失</th><th>勝点</th></tr>
          </thead>
          <tbody id="standings-body"></tbody>
        </table>
      </div>
    </div>
  </section>
  <script src="/app.js?v=1.0.1-flat-match-days-fix" type="module"></script>
</body>
</html>
