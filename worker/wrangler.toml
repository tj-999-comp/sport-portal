name = "sport-portal-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
APP_ORIGIN = "https://sport-portal.pages.dev"

[[kv_namespaces]]
binding = "SPORTAL_DATA"
id = "60874002e24041be8154a96d3cbc974b"

[triggers]
# Production updates are triggered by GitHub Actions. Keep the Worker
# request-driven so Cloudflare Cron Trigger limits do not apply here.
crons = []

# STG is deployed with `wrangler deploy --env stg` and uses isolated
# resources. The KV ID must be filled after the STG namespace is created.
[env.stg]
name = "sport-portal-api-stg"

[env.stg.vars]
APP_ORIGIN = "https://stg.sport-portal.pages.dev"

[[env.stg.kv_namespaces]]
binding = "SPORTAL_DATA"
id = "a2ddffe1d704474db6ae5f7ba65c67b9"

# Keep STG manual-only until the STG update policy is explicitly approved.
[env.stg.triggers]
crons = []
