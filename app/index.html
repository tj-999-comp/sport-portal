<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="スポーツポータルのリーグ選択画面">
  <title>スポーツポータル</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <main class="portal-shell">
    <header class="portal-header">
      <a class="brand-lockup" href="/" aria-label="スポーツポータル トップ">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>スポーツポータル</span>
      </a>
      <span class="environment-badge">検証環境</span>
    </header>

    <section class="portal-intro" aria-labelledby="portal-title">
      <h1 id="portal-title">リーグを選択</h1>
      <p>試合日程・結果・順位表をリーグごとに確認できます。</p>
    </section>

    <section class="league-section" aria-labelledby="league-title">
      <div class="section-heading"><span>01</span><h2 id="league-title">リーグ</h2><span>1件</span></div>
      <a class="league-card active" href="/j-league/">
        <div class="league-mark" aria-hidden="true">J1</div>
        <div class="league-copy"><span class="league-kicker">2026年</span><h3>Jリーグ</h3><p>J1リーグの試合予定・結果・順位表</p></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <section class="support-section" aria-labelledby="support-title">
      <div class="section-heading"><span>02</span><h2 id="support-title">その他</h2><span></span></div>
      <a class="support-link" href="/design-review.html"><span>デザインレビュー</span><span class="arrow" aria-hidden="true">→</span></a>
      <p class="future-note">リーグの追加やページ構成の変更は、ここから拡張します。</p>
    </section>

    <footer class="portal-footer"><span>スポーツポータル</span><span>検証環境</span></footer>
  </main>
</body>
</html>
