<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Design mockups</title>
  <link rel="stylesheet" href="design-mockups.css">
</head>
<body class="v01">
  <main class="mockup-shell">
    <header class="topbar">
      <div class="brand-lockup"><span class="brand-mark"></span><span class="brand-name">スポーツポータル</span></div>
      <div class="topbar-meta"><span>2026</span><button class="icon-button" aria-label="順位表">↗</button></div>
    </header>

    <section class="intro">
      <div class="intro-label">J1 / 今日</div>
      <div class="date-display"><span class="date-number">09</span><span class="date-rest"><span>12</span><span>土</span></span><span class="date-simple">2026年9月6日</span></div>
      <div class="intro-rule"></div>
      <p class="update-note"><i></i> 12:00 更新済み</p>
    </section>

    <nav class="date-nav" aria-label="日付">
      <button class="date-chip muted"><small>9月</small><strong>5</strong><span>土</span></button>
      <button class="date-chip active"><small>9月</small><strong>6</strong><span>日</span></button>
      <button class="date-chip"><small>9月</small><strong>7</strong><span>月</span></button>
      <button class="date-chip"><small>9月</small><strong>8</strong><span>火</span></button>
      <button class="date-chip"><small>9月</small><strong>9</strong><span>水</span></button>
    </nav>

    <section class="schedule">
      <div class="section-head"><span class="section-index">01</span><h1>試合</h1><span class="section-count">6試合</span></div>
      <article class="day-block today">
        <header class="day-head"><div><span class="day-number">09.06</span><span class="day-week">日</span></div><span class="day-state">今日</span></header>
        <div class="match-list">
          <div class="match-row"><div class="match-info"><span class="match-time">18:00</span><span class="match-round">第29節</span></div><div class="teams"><span>浦和</span><b>2</b><span>鹿島</span><b>1</b></div><span class="match-dot win"></span></div>
          <div class="match-row"><div class="match-info"><span class="match-time">19:00</span><span class="match-round">第29節</span></div><div class="teams"><span>川崎</span><b>0</b><span>G大阪</span><b>0</b></div><span class="match-dot draw"></span></div>
          <div class="match-row upcoming"><div class="match-info"><span class="match-time">21:00</span><span class="match-round">第29節</span></div><div class="teams"><span>横浜FM</span><em>—</em><span>神戸</span></div><span class="match-dot next"></span></div>
        </div>
      </article>
      <article class="day-block"><header class="day-head"><div><span class="day-number">09.13</span><span class="day-week">日</span></div><span class="day-state">3試合</span></header><div class="match-list compact"><div class="match-row"><div class="match-info"><span class="match-time">14:00</span><span class="match-round">第30節</span></div><div class="teams"><span>新潟</span><em>—</em><span>柏</span></div><span class="match-dot next"></span></div><div class="match-row"><div class="match-info"><span class="match-time">16:00</span><span class="match-round">第30節</span></div><div class="teams"><span>東京</span><em>—</em><span>広島</span></div><span class="match-dot next"></span></div></div></article>
    </section>

    <section class="status-strip"><span class="status-pulse"></span><span>更新済み　12:00</span><button class="refresh" aria-label="更新">↻</button></section>
    <footer class="bottom-nav"><button class="selected"><span>◒</span><small>試合</small></button><button><span>▦</span><small>順位</small></button><button><span>•••</span><small>その他</small></button></footer>
  </main>
  <div class="standings-modal" aria-hidden="true">
    <div class="modal-scrim"></div>
    <section class="modal-panel" aria-label="順位表">
      <div class="modal-grabber"></div>
      <header class="modal-header"><div><p>順位表</p><h2>J1リーグ</h2></div><button aria-label="閉じる">×</button></header>
      <div class="standing-table">
        <div class="standing-row standing-label"><span>順位</span><span>チーム</span><span>試合</span><span>勝点</span></div>
        <div class="standing-row"><b>1</b><strong>鹿島</strong><span>29</span><em>64</em></div>
        <div class="standing-row"><b>2</b><strong>浦和</strong><span>29</span><em>61</em></div>
        <div class="standing-row current"><b>3</b><strong>神戸</strong><span>29</span><em>57</em></div>
        <div class="standing-row"><b>4</b><strong>川崎</strong><span>29</span><em>55</em></div>
        <div class="standing-row"><b>5</b><strong>広島</strong><span>29</span><em>52</em></div>
      </div>
      <p class="modal-note">全20チーム</p>
    </section>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const variant = String(Math.min(20, Math.max(1, Number(params.get('v') || 1)))).padStart(2, '0');
    document.body.className = `v${variant}${params.has('modal') ? ' modal-open' : ''}`;
    document.title = `Design mockup ${variant}`;
  </script>
</body>
</html>
