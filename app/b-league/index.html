<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Bリーグのページ">
  <title>スポーツポータル | Bリーグ</title>
  <link rel="stylesheet" href="/portal.css">
  <link rel="stylesheet" href="/sport-themes.css">
</head>
<body class="sport-theme sport-theme--b-league">
  <main class="portal-shell">
    <header class="portal-header">
      <a class="brand-lockup" href="/" aria-label="スポーツポータルへ戻る">スポーツポータル</a>
      <label class="page-switcher-wrap">
        <span class="sr-only">ページを選択</span>
        <select class="page-switcher" data-page-switcher aria-label="ページを選択">
          <option value="/">トップ</option>
          <option value="/j-league/">Jリーグ</option>
          <option value="/npb/">NPB</option>
          <option value="/b-league/" selected>Bリーグ</option>
          <option value="/nba/">NBA</option>
        </select>
      </label>
    </header>
    <section class="portal-intro sport-hero sport-hero--court" aria-labelledby="placeholder-title">
      <p class="sport-kicker">JAPAN · PROFESSIONAL BASKETBALL</p>
      <h1 id="placeholder-title">Bリーグ</h1>
      <p class="sport-placeholder">作成途中です</p>
      <span class="sport-mark sport-mark--court" aria-hidden="true"></span>
    </section>
    <a class="support-link" href="/">ポータルへ戻る<span class="arrow" aria-hidden="true">→</span></a>
  </main>
  <script src="/header-nav.js?v=1.0.0" defer></script>
</body>
</html>
