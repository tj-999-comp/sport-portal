<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="スポーツポータルのリーグ選択画面">
  <title>スポーツポータル</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <main class="portal-shell">
    <header class="portal-header">
      <a class="brand-lockup" href="/" aria-label="スポーツポータル トップ">スポーツポータル</a>
      <span class="version-badge">v1.0.0 STG</span>
    </header>

    <section class="portal-intro" aria-labelledby="portal-title">
      <h1 id="portal-title">リーグを選択</h1>
      <p>試合日程・結果・順位表をリーグごとに確認できます。</p>
    </section>

    <section class="league-section" aria-label="リーグ">
      <a class="league-card" href="/j-league/" aria-label="Jリーグを選択">
        <div class="league-copy"><h3>Jリーグ</h3></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="league-card" href="/npb/" aria-label="NPBを選択">
        <div class="league-copy"><h3>NPB</h3></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="league-card" href="/b-league/" aria-label="Bリーグを選択">
        <div class="league-copy"><h3>Bリーグ</h3></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="league-card" href="/nba/" aria-label="NBAを選択">
        <div class="league-copy"><h3>NBA</h3></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <section class="support-section" aria-label="関連ページ">
      <a class="support-link" href="/design-review.html"><span>デザインレビュー</span><span class="arrow" aria-hidden="true">→</span></a>
    </section>

    <footer class="portal-footer"><span>スポーツポータル</span><span>v1.0.0 STG</span></footer>
  </main>
</body>
</html>
